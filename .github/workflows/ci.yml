name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Zenbet.EventsMarkets.sln

      - name: Build
        run: dotnet build Zenbet.EventsMarkets.sln -c Release --no-restore

      - name: Unit tests (no containers)
        run: dotnet test tests/Zenbet.EventsMarkets.Unit.Tests/Zenbet.EventsMarkets.Unit.Tests.csproj -c Release --no-build

      - name: PostgreSQL integration tests (Testcontainers)
        run: dotnet test tests/Zenbet.EventsMarkets.Integration.Tests/Zenbet.EventsMarkets.Integration.Tests.csproj -c Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api/v1
      VITE_AUTH_URL: /api
      VITE_HUB_URL: /odds-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
