services:
  # ============================================================================
  # POSTGRESQL 16+ (Persistencia para Ledger inmutable, Outbox y Eventos)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: zenbet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenbet_events_markets}
      POSTGRES_USER: ${POSTGRES_USER:-zenbet}
      # Sin valor por defecto: un secreto real nunca debe tener un fallback
      # hardcodeado. Define POSTGRES_PASSWORD en tu .env (ver .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en tu archivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenbet} -d ${POSTGRES_DB:-zenbet_events_markets}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zenbet-network

  # ============================================================================
  # BACKEND .NET 10 API & WORKERS EN SEGUNDO PLANO (Perfil: api / full)
  # ============================================================================
  backend:
    profiles: ["api", "full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenbet-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__EventsMarkets: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-zenbet_events_markets};Username=${POSTGRES_USER:-zenbet};Password=${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en tu archivo .env}"
      # Sin valores por defecto: Program.cs rechaza arrancar fuera de Development
      # si estos secretos faltan, son cortos o siguen siendo los de ejemplo.
      Auth__SigningKey: ${JWT_SIGNING_KEY:?Debes definir JWT_SIGNING_KEY en tu archivo .env (ver .env.example)}
      # Secreto HMAC de la pasarela RGS. Vacío = los callbacks RGS se rechazan.
      Rgs__SharedSecret: ${RGS_SHARED_SECRET:-}
      # Primer administrador (opcional, se crea solo si no existe ningún admin).
      # Retira la contraseña del entorno tras el primer arranque.
      Admin__Bootstrap__Username: ${ADMIN_BOOTSTRAP_USERNAME:-}
      Admin__Bootstrap__Email: ${ADMIN_BOOTSTRAP_EMAIL:-}
      Admin__Bootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # Las migraciones ya no dependen de la siembra de datos.
      Database__MigrateOnStartup: "true"
      # Datos DEMO (cartelera UFC de referencia y partidos de fútbol ficticios): apagados por defecto.
      # Para una demostración local: SEED_UFC_DEMO=true / SEED_FOOTBALL_DEMO=true en tu .env.
      Seeding__Ufc__Enabled: "${SEED_UFC_DEMO:-false}"
      Seeding__Ufc__ApplyMigrations: "true"
      Seeding__Ufc__ForceRefresh: "false"
      Seeding__Football__Enabled: "${SEED_FOOTBALL_DEMO:-false}"
      # Las lineas "de referencia" (cuotas de modelo, no ejecutables) no admiten apuestas salvo opt-in explicito.
      Betting__AllowReferenceLines: "${ALLOW_REFERENCE_LINES:-false}"
    ports:
      - "5005:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/healthz >/dev/null || wget -qO- http://localhost:5000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zenbet-network

  # ============================================================================
  # FRONTEND REACT 19 + VITE (Perfil: full)
  # ============================================================================
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-/api}
        VITE_HUB_URL: ${VITE_HUB_URL:-/odds-hub}
        VITE_FIGHT_HUB_URL: ${VITE_FIGHT_HUB_URL:-/fight-hub}
    container_name: zenbet-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zenbet-network

# ==============================================================================
# VOLÚMENES PERSISTENTES
# ==============================================================================
volumes:
  postgres_data:
    name: zenbet_postgres_data

# ==============================================================================
# RED DE COMUNICACIÓN AISLADA
# ==============================================================================
networks:
  zenbet-network:
    name: zenbet-network
    driver: bridge
