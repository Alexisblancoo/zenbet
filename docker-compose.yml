services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenbet_events_markets}
      POSTGRES_USER: ${POSTGRES_USER:-zenbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zenbet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__EventsMarkets: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-zenbet_events_markets};Username=${POSTGRES_USER:-zenbet};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Auth__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Settlement__ApiKey: ${SETTLEMENT_API_KEY:?SETTLEMENT_API_KEY is required}
      Seeding__Ufc__Enabled: "true"
      Seeding__Ufc__ApplyMigrations: "true"
      Seeding__Ufc__ForceRefresh: "false"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:5000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zenbet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-/api}
        VITE_HUB_URL: ${VITE_HUB_URL:-/odds-hub}
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zenbet

volumes:
  postgres_data:

networks:
  zenbet:
    driver: bridge
